name: CPU protocol tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        torch: ['2.8.0', '2.9.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/h100.sh
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: bash -n scripts/run_4gpu.sh
      - run: bash -n scripts/slurm.sh
      - run: torchrun --standalone --nproc-per-node=2 -m tests.ddp_smoke --output /tmp/nanogpt-ddp-2
      - run: torchrun --standalone --nproc-per-node=4 -m tests.ddp_smoke --output /tmp/nanogpt-ddp-4
